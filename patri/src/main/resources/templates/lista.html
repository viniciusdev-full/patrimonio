<%@ page contentType="text/html;charset=UTF-8" language="java"%>
<%@ taglib uri="jakarta.tags.core" prefix="c"%>

<html xmlns:c="">
<head>
    <title>Lista de Patrimonio</title>
</head>

<body>

<h2>CONTROLE DE PATRIMONIO</h2>

<a href="/patrimonios/novo">Cadastro novo</a>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>NR PATRIMONIO</th>
        <th>DESCRICAO</th>
        <th>LOCAL</th>
        <th>AÇÕES</th>
    </tr>
    </thead>

    <tbody>

    <c:forEach var="item" items="${listapatrimonio}">

        <tr>
            <td>${item.id}</td>
            <td>${item.nrpatrimonio}</td>
            <td>${item.descricao}</td>
            <td>${item.local}</td>

            <td>
                <a href="/patrimonios/editar/${item.id}">
                    Editar
                </a>

                <a href="/patrimonios/excluir/${item.id}"
                   onclick="return confirm('Deseja excluir este patrimônio?')">
                    Excluir
                </a>
            </td>
        </tr>

    </c:forEach>

    </tbody>

</table>

</body>
</html>
