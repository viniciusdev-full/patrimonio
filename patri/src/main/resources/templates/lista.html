
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Patrimônio</title>
</head>

<body>

<h2>CONTROLE DE PATRIMÔNIO</h2>

<!-- Botão para cadastrar novo patrimônio -->
<p>
    <a th:href="@{/patrimonios/novo}">
        CADASTRAR NOVO PATRIMÔNIO
    </a>
</p>

<!-- Tabela de patrimônios -->
<table border="1" cellpadding="8" cellspacing="0">

    <thead>
    <tr>
        <th>ID</th>
        <th>NR PATRIMÔNIO</th>
        <th>DESCRIÇÃO</th>
        <th>LOCAL</th>
        <th>AÇÕES</th>
    </tr>
    </thead>

    <tbody>

    <!-- Percorrer a lista de patrimônios -->
    <tr th:each="item : ${listarPatrimonios}">

        <td th:text="${item.id}"></td>

        <td th:text="${item.nrPatrimonio}"></td>

        <td th:text="${item.descricao}"></td>

        <td th:text="${item.local}"></td>

        <td>

            <!-- Editar patrimônio -->
            <a th:href="@{/patrimonios/editar/{id}(id=${item.id})}">
                EDITAR
            </a>

            |

            <!-- Excluir patrimônio -->
            <a th:href="@{/patrimonios/excluir/{id}(id=${item.id})}"
               onclick="return confirm('Deseja realmente excluir este patrimônio?')">
                EXCLUIR
            </a>

        </td>

    </tr>

    <!-- Mensagem quando não houver registros -->
    <tr th:if="${#lists.isEmpty(listarPatrimonios)}">

        <td colspan="5">
            Nenhum patrimônio cadastrado.
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
