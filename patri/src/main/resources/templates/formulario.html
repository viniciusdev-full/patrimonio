
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulário de Patrimônio</title>
</head>

<body>

<h2>CADASTRO / EDIÇÃO DE PATRIMÔNIO</h2>

<form th:action="@{/patrimonios/salvar}"
      th:object="${patrimonio}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label>NR PATRIMÔNIO</label>

    <input type="text"
           th:field="*{nrPatrimonio}"
           required>

    <br><br>

    <label>DESCRIÇÃO</label>

    <input type="text"
           th:field="*{descricao}"
           required>

    <br><br>

    <label>LOCAL</label>

    <input type="text"
           th:field="*{local}"
           required>

    <br><br>

    <button type="submit">Salvar</button>

    <br><br>

    <a th:href="@{/patrimonios}">Cancelar</a>

</form>

</body>
</html>
