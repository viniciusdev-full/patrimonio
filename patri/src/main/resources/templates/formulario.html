
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Patrimônio</title>
</head>

<body>

<h2>CADASTRO / EDIÇÃO DE PATRIMÔNIO</h2>

<form th:action="@{/patrimonios/salvar}"
      th:object="${patrimonio}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="nrPatrimonio">NR PATRIMÔNIO</label>

        <input type="text"
               id="nrPatrimonio"
               th:field="*{nrPatrimonio}"
               maxlength="50"
               required>
    </div>

    <br>

    <div>
        <label for="descricao">DESCRIÇÃO</label>

        <input type="text"
               id="descricao"
               th:field="*{descricao}"
               maxlength="255"
               required>
    </div>

    <br>

    <div>
        <label for="local">LOCAL</label>

        <input type="text"
               id="local"
               th:field="*{local}"
               maxlength="255"
               required>
    </div>

    <br>

    <button type="submit">Salvar</button>

    <a th:href="@{/patrimonios}">Cancelar</a>

</form>

</body>
</html>
